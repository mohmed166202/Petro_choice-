# Phase 3: Baseline Detector Training Configuration (Seed 42)
experiment:
  name: "ppe_helmet_detection"
  run_id: "exp0_baseline_seed42"
  changed_variable: "baseline"
  seed: 42
  tracking_uri: "sqlite:///mlflow.db"

data:
  dataset_yaml: "data/dataset.yaml"
  img_size: 640
  batch_size: 16
  workers: 4

model:
  weights: "yolov8n.pt"
  epochs: 30
  patience: 10
  optimizer: "SGD"
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0

augmentation:
  mosaic: 1.0
  scale: 0.5
  fliplr: 0.5
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4

loss:
  cls_loss_gain: 0.5
  box_loss_gain: 7.5
