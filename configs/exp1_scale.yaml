# Phase 4 - Ablation 1: Scale Jittering (Small Object Hypothesis)
# Hypothesis: Since ~70% of targets are small (<32x32 px), increasing scale jitter
# to 0.7 enhances multiscale representations for distant heads.
experiment:
  name: "ppe_helmet_detection"
  run_id: "exp1_scale"
  changed_variable: "scale_jitter"
  seed: 42
  tracking_uri: "sqlite:///mlflow.db"

data:
  dataset_yaml: "data/dataset.yaml"
  img_size: 640
  batch_size: 16
  workers: 4

model:
  weights: "yolov8n.pt"
  epochs: 30
  patience: 10
  optimizer: "SGD"
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  cos_lr: false

augmentation:
  mosaic: 1.0
  scale: 0.7          # CHANGED: 0.5 -> 0.7 (Multiscale scale jittering)
  fliplr: 0.5
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4

loss:
  cls_loss_gain: 0.5
  box_loss_gain: 7.5
