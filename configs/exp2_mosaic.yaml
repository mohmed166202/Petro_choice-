# Phase 4 - Ablation 2: Mosaic Setting Tuning (Crowd Scene Hypothesis)
# Hypothesis: High-density crowds (up to 162 heads/img) suffer from severe cropping under
# 100% Mosaic. Reducing mosaic to 0.5 preserves natural multi-person spatial context.
experiment:
  name: "ppe_helmet_detection"
  run_id: "exp2_mosaic"
  changed_variable: "mosaic_probability"
  seed: 42
  tracking_uri: "sqlite:///mlflow.db"

data:
  dataset_yaml: "data/dataset.yaml"
  img_size: 640
  batch_size: 16
  workers: 4

model:
  weights: "yolov8n.pt"
  epochs: 30
  patience: 10
  optimizer: "SGD"
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  cos_lr: false

augmentation:
  mosaic: 0.5          # CHANGED: 1.0 -> 0.5 (Reduced mosaic downscaling)
  scale: 0.5
  fliplr: 0.5
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4

loss:
  cls_loss_gain: 0.5
  box_loss_gain: 7.5
