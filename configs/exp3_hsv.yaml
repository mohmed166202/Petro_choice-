# Phase 4 - Ablation 3: Color/HSV Augmentation (Web Illumination Variance Hypothesis)
# Hypothesis: Web-scraped images exhibit high exposure and saturation noise. Lowering saturation
# gain (hsv_s: 0.4) reduces false color overfitting on bright safety helmets.
experiment:
  name: "ppe_helmet_detection"
  run_id: "exp3_hsv"
  changed_variable: "hsv_saturation"
  seed: 42
  tracking_uri: "sqlite:///mlflow.db"

data:
  dataset_yaml: "data/dataset.yaml"
  img_size: 640
  batch_size: 16
  workers: 4

model:
  weights: "yolov8n.pt"
  epochs: 30
  patience: 10
  optimizer: "SGD"
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  cos_lr: false

augmentation:
  mosaic: 1.0
  scale: 0.5
  fliplr: 0.5
  hsv_h: 0.015
  hsv_s: 0.4          # CHANGED: 0.7 -> 0.4 (Tighter saturation bounds)
  hsv_v: 0.4

loss:
  cls_loss_gain: 0.5
  box_loss_gain: 7.5
