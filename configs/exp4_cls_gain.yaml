# Phase 4 - Ablation 4: Classification Loss Gain (12.33:1 Imbalance Hypothesis)
# Hypothesis: With a 12.33:1 imbalance favoring bare heads, tripling class loss gain (cls: 1.5)
# forces the network to penalize minority helmet classification mistakes heavily.
experiment:
  name: "ppe_helmet_detection"
  run_id: "exp4_cls_gain"
  changed_variable: "classification_loss_gain"
  seed: 42
  tracking_uri: "sqlite:///mlflow.db"

data:
  dataset_yaml: "data/dataset.yaml"
  img_size: 640
  batch_size: 16
  workers: 4

model:
  weights: "yolov8n.pt"
  epochs: 30
  patience: 10
  optimizer: "SGD"
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  cos_lr: false

augmentation:
  mosaic: 1.0
  scale: 0.5
  fliplr: 0.5
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4

loss:
  cls_loss_gain: 1.5   # CHANGED: 0.5 -> 1.5 (Increased classification penalty)
  box_loss_gain: 7.5
