# Phase 4 - Ablation 6: High Resolution Input (Feature Pyramid Spatial Detail Hypothesis)
# Hypothesis: Increasing input resolution from 640 to 800 px expands small <32px targets by 56% in
# area, boosting detection of distant workers at the cost of higher training/inference latency.
experiment:
  name: "ppe_helmet_detection"
  run_id: "exp6_imgsz_800"
  changed_variable: "input_resolution"
  seed: 42
  tracking_uri: "sqlite:///mlflow.db"

data:
  dataset_yaml: "data/dataset.yaml"
  img_size: 800        # CHANGED: 640 -> 800 (Higher spatial resolution)
  batch_size: 16
  workers: 4

model:
  weights: "yolov8n.pt"
  epochs: 30
  patience: 10
  optimizer: "SGD"
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  cos_lr: false

augmentation:
  mosaic: 1.0
  scale: 0.5
  fliplr: 0.5
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4

loss:
  cls_loss_gain: 0.5
  box_loss_gain: 7.5
